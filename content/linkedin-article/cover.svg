<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" style="background:#fcfcfb">
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 72px; font-weight: 700; fill: #0b0b0b; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 28px; font-weight: 400; fill: #52514e; }
      .accent { fill: #2a78d6; }
      .shape { fill: none; stroke: #2a78d6; stroke-width: 3; }
    </style>
  </defs>
  
  <!-- Background grid pattern suggesting a factory -->
  <g opacity="0.1">
    <line x1="300" y1="0" x2="300" y2="630" stroke="#2a78d6" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#2a78d6" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#2a78d6" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#2a78d6" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#2a78d6" stroke-width="1"/>
  </g>
  
  <!-- Stylized assembly line representation -->
  <g transform="translate(100, 220)">
    <circle cx="0" cy="0" r="30" class="accent"/>
    <rect x="30" y="-3" width="200" height="6" class="accent"/>
    <circle cx="250" cy="0" r="30" class="accent"/>
    <rect x="280" y="-3" width="200" height="6" class="accent"/>
    <circle cx="500" cy="0" r="30" class="accent"/>
    <rect x="530" y="-3" width="200" height="6" class="accent"/>
    <circle cx="750" cy="0" r="30" class="accent"/>
    <rect x="780" y="-3" width="200" height="6" class="accent"/>
    <circle cx="1000" cy="0" r="30" class="accent"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="380" text-anchor="middle" class="title">ANVIL</text>
  <text x="600" y="430" text-anchor="middle" class="subtitle">Agentic Network for Verified Implementation Lifecycle</text>
  <text x="600" y="480" text-anchor="middle" class="subtitle" style="font-size: 24px;">A factory for software and content</text>
</svg>
