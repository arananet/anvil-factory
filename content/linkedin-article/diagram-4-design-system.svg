<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" style="background:#fcfcfb">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #2a78d6; stroke-width: 2; rx: 8; }
      .file { fill: #eda100; stroke: #0b0b0b; stroke-width: 2; rx: 6; }
      .station { fill: #2a78d6; stroke: #0b0b0b; stroke-width: 2; rx: 6; }
      .reviewer { fill: #1baf7a; stroke: #0b0b0b; stroke-width: 2; rx: 6; }
      .warning { fill: #e34948; stroke: #0b0b0b; stroke-width: 2; rx: 6; }
      .label-white { font-family: system-ui, sans-serif; font-size: 15px; fill: #ffffff; font-weight: 500; }
      .label-black { font-family: system-ui, sans-serif; font-size: 15px; fill: #0b0b0b; font-weight: 500; }
      .title { font-family: system-ui, sans-serif; font-size: 28px; fill: #0b0b0b; font-weight: 600; }
      .heading { font-family: system-ui, sans-serif; font-size: 20px; fill: #0b0b0b; font-weight: 600; }
      .arrow { fill: none; stroke: #52514e; stroke-width: 2; marker-end: url(#arrowhead); }
      .item { font-family: system-ui, sans-serif; font-size: 13px; fill: #0b0b0b; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#52514e"/>
    </marker>
  </defs>
  
  <text x="600" y="40" text-anchor="middle" class="title">Per-Project Design Systems</text>
  
  <!-- Design files (top) -->
  <g transform="translate(400, 100)">
    <text x="200" y="0" text-anchor="middle" class="heading">Project Design Files</text>
    
    <rect x="20" y="20" width="180" height="70" class="file"/>
    <text x="110" y="50" text-anchor="middle" class="label-white">design/</text>
    <text x="110" y="70" text-anchor="middle" class="label-white">DESIGN.md</text>
    
    <rect x="220" y="20" width="180" height="70" class="file"/>
    <text x="310" y="50" text-anchor="middle" class="label-white">design/</text>
    <text x="310" y="70" text-anchor="middle" class="label-white">tokens.json</text>
  </g>
  
  <!-- Created by scaffolding -->
  <g transform="translate(100, 230)">
    <rect x="0" y="0" width="350" height="120" class="box"/>
    <text x="175" y="30" text-anchor="middle" class="heading">Scaffolding Behavior</text>
    <g transform="translate(20, 50)">
      <text x="0" y="0" class="item">✓ Creates design/ files when absent</text>
      <text x="0" y="20" class="item">✓ Never overwrites existing files</text>
      <text x="0" y="40" class="item">✓ Project controls its own design</text>
    </g>
  </g>
  
  <!-- Flows to station packets -->
  <path class="arrow" d="M 600 190 L 600 250"/>
  
  <g transform="translate(550, 230)">
    <rect x="0" y="0" width="500" height="120" class="box"/>
    <text x="250" y="30" text-anchor="middle" class="heading">Station Packet Enhancement</text>
    <g transform="translate(20, 50)">
      <text x="0" y="0" class="item">When project has design system:</text>
      <text x="20" y="20" class="item">• Interface-producing station packets gain</text>
      <text x="40" y="40" class="item">"Project design" section</text>
      <text x="20" y="60" class="item">• Contains tokens and quality bars</text>
    </g>
  </g>
  
  <!-- Interface stations -->
  <path class="arrow" d="M 500 380 L 500 420"/>
  <path class="arrow" d="M 800 380 L 800 420"/>
  
  <g transform="translate(100, 420)">
    <text x="400" y="0" text-anchor="middle" class="heading">Interface-Producing Stations</text>
    
    <rect x="50" y="20" width="180" height="60" class="station"/>
    <text x="140" y="55" text-anchor="middle" class="label-white">builder</text>
    <text x="140" y="72" text-anchor="middle" class="label-white" style="font-size: 12px;">(UI mode)</text>
    
    <rect x="270" y="20" width="180" height="60" class="station"/>
    <text x="360" y="55" text-anchor="middle" class="label-white">media-</text>
    <text x="360" y="72" text-anchor="middle" class="label-white">producer</text>
    
    <rect x="490" y="20" width="180" height="60" class="station"/>
    <text x="580" y="60" text-anchor="middle" class="label-white">...others</text>
  </g>
  
  <!-- Reviewer-design -->
  <path class="arrow" d="M 400 500 L 400 550"/>
  
  <rect x="300" y="550" width="200" height="80" class="reviewer"/>
  <text x="400" y="585" text-anchor="middle" class="label-white">reviewer-design</text>
  <text x="400" y="605" text-anchor="middle" class="label-white" style="font-size: 13px;">Judges output against</text>
  <text x="400" y="620" text-anchor="middle" class="label-white" style="font-size: 13px;">project design system</text>
  
  <!-- Warning path (right side) -->
  <g transform="translate(700, 420)">
    <text x="200" y="0" text-anchor="middle" class="heading">Without Design System</text>
    
    <rect x="50" y="20" width="300" height="100" class="warning" fill-opacity="0.2"/>
    <g transform="translate(70, 50)">
      <text x="0" y="0" class="item" fill="#e34948" font-weight="600">⚠ Run report shows warning</text>
      <text x="0" y="25" class="item">• Pipeline includes interface stations</text>
      <text x="0" y="45" class="item">• But project has no design system</text>
      <text x="0" y="65" class="item">• reviewer-design must not pass vacuously</text>
    </g>
  </g>
  
  <!-- Dogfooding note -->
  <g transform="translate(100, 700)">
    <rect x="0" y="0" width="1000" height="120" class="box" stroke="#1baf7a" stroke-width="3"/>
    <text x="500" y="35" text-anchor="middle" class="heading" fill="#1baf7a">ANVIL Dogfoods Its Own Design</text>
    <g transform="translate(50, 55)">
      <text x="0" y="0" class="item">✓ Factory has design/DESIGN.md and design/tokens.json</text>
      <text x="0" y="25" class="item">✓ Validated palette from dataviz skill (light/dark modes)</text>
      <text x="0" y="50" class="item">✓ All diagrams and media follow the documented system</text>
    </g>
  </g>
</svg>
