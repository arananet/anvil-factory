{
  "version": 1,
  "efficiency": {
    "max_packet_tokens": 48000,
    "max_runtime_turns": 100,
    "tool_output_tokens": 2000,
    "max_agent_calls": 32,
    "max_run_tokens": 3000000,
    "cache_read_weight": 0.1,
    "carry_passed_reviews": true,
    "require_usage": false,
    "station_budgets": {
      "intake": 100000,
      "spec-writer": 250000,
      "test-writer": 600000,
      "builder": 1000000,
      "reviewer-spec": 120000,
      "reviewer-security": 120000,
      "reviewer-tests": 120000,
      "reviewer-architecture": 120000,
      "reviewer-design": 120000,
      "reviewer-ux": 120000,
      "approver": 30000,
      "triage-human": 20000,
      "deployer": 80000,
      "observer": 200000
    }
  },
  "status_projects": [
    "project-reports/sentia",
    "project-reports/platform25",
    "project-reports/taskline"
  ],
  "servable": {
    "static_root": "status",
    "page_path": "/index.html"
  },
  "runtime": {
    "command": "python3 tools/dispatch_station.py {packet} {output}",
    "kind": "command",
    "timeout_seconds": 7200
  },
  "observability": {
    "sinks": [
      {
        "type": "github-issue"
      }
    ]
  },
