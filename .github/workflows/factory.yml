name: factory
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate all pipelines
        run: |
          for f in pipelines/*.json; do python -m anvil.cli validate-pipeline "$f"; done
      - name: Check factory spec gates
        run: |
          python -m anvil.cli check . --slug factory-pipeline-engine
          python -m anvil.cli check . --slug greenfield-projects
          python -m anvil.cli check . --slug content-factory
          python -m anvil.cli check . --slug existing-project-onboarding
          python -m anvil.cli check-content examples/content/why-factories --slug content-demo
      - name: Worker tests
        run: node --test "intake-worker/*.test.js"
