name: anvil-execute-content

# Execute mode run of the ANVIL content line against the factory repository
# itself, for one known work order (issue 4, LinkedIn article update). It
# mirrors anvil-execute.yml with the differences this run needs:
#
# - The pipeline is content-default and the work order is
#   work-orders/issue-4.json; the CLI runs from this checkout (PYTHONPATH=.)
#   because the factory is both the line and the project.
# - The work order carries the publishing risk hint on purpose. The draft
#   this run produces stops at the human gate for Edu's review; the
#   publisher station inside the sandbox can only write a text record into
#   the run directory, and nothing in this workflow posts anything anywhere.
# - This repo's .gitignore ignores runs/, so the commit back step force adds
#   the run evidence for this work order. The evidence belongs on the branch.
#
# Trigger: the vault PAT cannot dispatch workflows or apply labels, so the
# trigger is a push to the anvil/run-article-update branch. The commit this
# workflow pushes back uses GITHUB_TOKEN, which does not retrigger
# workflows, so the run cannot loop on its own push.

on:
  push:
    branches: [anvil/run-article-update]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: anvil-execute-content-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  anvil-execute-content:
    name: Run the ANVIL content line with Claude Code executing the stations
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_BASE_URL: https://gateway.ai.cloudflare.com/v1/693ae9c587f1f2c34328bb47447366b0/arananet-ai-gateway/anthropic
      ANTHROPIC_API_KEY: <redacted>
      ANTHROPIC_CUSTOM_HEADERS: "cf-aig-authorization: Bearer ${{ secrets.CF_AIG_TOKEN }}"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Gateway smoke test
        id: smoke
        run: |
          REPLY=$(claude -p "Reply with exactly: GATEWAY_OK" --model claude-sonnet-4-5 --output-format text)
          echo "Gateway reply: ${REPLY}"
          CLEAN=$(printf '%s' "${REPLY}" | tr -d '[:space:]')
          if [ "${CLEAN}" != "GATEWAY_OK" ]; then
            echo "Gateway smoke failed: expected GATEWAY_OK and got the reply above. Stopping before the line runs."
            exit 1
          fi
          echo "Gateway smoke passed: the gateway answered through the Anthropic endpoint."

      - name: Run the ANVIL content-default line in execute mode
        id: line
        run: |
          PYTHONPATH=. python3 -m anvil.cli run . \
            --pipeline pipelines/content-default.json \
            --work-order work-orders/issue-4.json \
            --execute

      - name: Commit the run evidence back to the branch
        if: always() && steps.smoke.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f runs/ 2>/dev/null || true
          git diff --cached --stat > run-diff.txt || true
          if git diff --cached --quiet; then
            echo "The run produced no file changes to commit."
            exit 0
          fi
          VERDICT=$(python3 -c "import json; print(json.load(open('runs/wo-gh-4/report.json'))['verdict'])" 2>/dev/null || echo "no-report")
          git commit -m "ANVIL execute run wo-gh-4 (issue 4): verdict ${VERDICT}" -m "Content stations executed by Claude Code (claude-sonnet-4-5) through the Cloudflare AI Gateway. Draft and run evidence included; see runs/wo-gh-4/. Publishing hold: draft only, nothing posted."
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; echo "Rebase onto the branch tip failed; pushing as is not attempted."; exit 1; }
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Comment the run report on issue 4
        if: always() && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: <redacted>
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path
          run_url = os.environ["RUN_URL"]
          branch = os.environ["BRANCH"]
          report_path = Path("runs/wo-gh-4/report.json")
          if not report_path.exists():
              lines = [
                  "## ANVIL execute run report",
                  "",
                  "The executed run did not produce a report.json, so there is no verdict to report. "
                  f"See the workflow run for the failure: {run_url}",
              ]
              Path("comment.md").write_text("\n".join(lines) + "\n")
              raise SystemExit(0)
          report = json.loads(report_path.read_text())
          decision = report.get("decision", {})
          lines = [
              "## ANVIL execute run report",
              "",
              f"Work order: {report['work_order_id']}",
              f"Pipeline: {report['pipeline']}",
              f"Approver verdict: {report['verdict']}",
              f"Human review required: {report['human_required']}",
              f"Deployment status: {report.get('deployment_status')}",
              "",
              "Decision record:",
              f"- Approver: {decision.get('approver', {}).get('rule', '')}",
              f"- Human gate: {decision.get('human_gate', {}).get('rule', '')}",
              "",
              "| Station | Status | Configured model | Executed model |",
              "|---|---|---|---|",
          ]
          for step in report.get("steps", []):
              lines.append(
                  f"| {step['station']} | {step['status']} | "
                  f"{step.get('configured_model')} | {step.get('executed_model')} |"
              )
          warnings = report.get("warnings") or []
          if warnings:
              lines += ["", "Warnings recorded by the run:"] + [f"- {w}" for w in warnings]
          diff_path = Path("run-diff.txt")
          if diff_path.exists() and diff_path.read_text().strip():
              lines += ["", "Files changed by the run (committed to "
                        f"`{branch}`):", "", "```", diff_path.read_text().strip(), "```"]
          lines += [
              "",
              "Honest note: this run EXECUTED its content stations. Claude Code "
              "(claude-sonnet-4-5), routed through the Cloudflare AI Gateway, "
              "received each station packet via tools/claude_station.py and the "
              "writer produced the revised article draft held in runs/wo-gh-4/. "
              "The work order carries the publishing risk hint, so the draft "
              "stops at the human gate: nothing was published or posted anywhere.",
              f"Workflow run: {run_url}",
          ]
          Path("comment.md").write_text("\n".join(lines) + "\n")
          print(f"Verdict: {report['verdict']}")
          PYEOF
          gh issue comment 4 --body-file comment.md

      - name: Upload the run directory
        if: always() && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: anvil-execute-run-wo-gh-4
          path: runs/
          if-no-files-found: ignore
