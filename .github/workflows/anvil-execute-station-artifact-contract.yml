name: anvil-execute-station-artifact-contract

# Execute mode run of the ANVIL line against the factory repository itself,
# for one work order (issue 37). Mirrors anvil-execute.yml with the
# work order, branch and report paths set for this run. Trigger is a push
# to this branch, because the operator credential cannot dispatch
# workflows. The commit this workflow pushes back uses GITHUB_TOKEN, which
# does not retrigger workflows, so the run cannot loop on its own push.
on:
  push:
    branches: [anvil/run-station-artifact-contract]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: anvil-execute-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  anvil-execute:
    name: Run the ANVIL line with Claude Code executing the stations
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_BASE_URL: https://gateway.ai.cloudflare.com/v1/693ae9c587f1f2c34328bb47447366b0/arananet-ai-gateway/anthropic
      ANTHROPIC_API_KEY: ${{ secrets.CF_AIG_TOKEN }}
      ANTHROPIC_CUSTOM_HEADERS: "cf-aig-authorization: Bearer ${{ secrets.CF_AIG_TOKEN }}"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Install Codex (operator staged, for the OpenAI runtime)
        run: |
          npm install -g @openai/codex
          codex --version

      - name: Gateway smoke test (all migrated routes)
        id: smoke
        env:
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
        run: |
          for MODEL in claude-sonnet-5-5 claude-opus-5-5; do
            REPLY=$(claude -p "Reply with exactly: GATEWAY_OK" --model "${MODEL}" --output-format text)
            CLEAN=$(printf '%s' "${REPLY}" | tr -d '[:space:]')
            if [ "${CLEAN}" != "GATEWAY_OK" ]; then
              echo "Smoke failed for ${MODEL}: expected GATEWAY_OK, got: ${REPLY}"
              exit 1
            fi
            echo "Smoke passed: Anthropic route, ${MODEL}"
          done
          GW="https://gateway.ai.cloudflare.com/v1/693ae9c587f1f2c34328bb47447366b0/arananet-ai-gateway/openai/chat/completions"
          TEXT_BODY='{"model":"gpt-6.1-sol","messages":[{"role":"user","content":"Reply with exactly: GATEWAY_OK"}]}'
          TEXT_RESP=$(curl -s -X POST "${GW}" -H "Authorization: Bearer ${CF_AIG_TOKEN}" -H "Content-Type: application/json" -d "${TEXT_BODY}")
          echo "${TEXT_RESP}" | grep -q "GATEWAY_OK" || { echo "Smoke failed for gpt-6.1-sol text route: ${TEXT_RESP}"; exit 1; }
          echo "Smoke passed: OpenAI route, gpt-6.1-sol, text"
          PNG_B64=$(python3 -c "
          import zlib, struct, base64
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          raw = b'\x00\xff\x00\x00\x00\xff\x00\x00'
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 2, 1, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          print(base64.b64encode(png).decode())
          ")
          VISION_BODY="{\"model\":\"gpt-6.1-sol\",\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"text\",\"text\":\"You were given an image. Reply with exactly: IMAGE_OK\"},{\"type\":\"image_url\",\"image_url\":{\"url\":\"data:image/png;base64,${PNG_B64}\"}}]}]}"
          VISION_RESP=$(curl -s -X POST "${GW}" -H "Authorization: Bearer ${CF_AIG_TOKEN}" -H "Content-Type: application/json" -d "${VISION_BODY}")
          echo "${VISION_RESP}" | grep -q "IMAGE_OK" || { echo "Smoke failed for gpt-6.1-sol vision route: ${VISION_RESP}"; exit 1; }
          echo "Smoke passed: OpenAI route, gpt-6.1-sol, vision"

      - name: Install Playwright and Chromium (operator staged)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run the ANVIL sdlc-default line in execute mode
        id: line
        run: |
          PYTHONPATH=. python3 -m anvil.cli run . \
            --pipeline pipelines/sdlc-default.json \
            --work-order work-orders/issue-37.json \
            --execute

      - name: Commit the run evidence and the station change back to the branch
        if: always() && steps.smoke.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f runs/ 2>/dev/null || true
          git diff --cached --stat > run-diff.txt || true
          git add run-diff.txt
          if git diff --cached --quiet; then
            echo "The run produced no file changes to commit."
            exit 0
          fi
          VERDICT=$(python3 -c "import json; print(json.load(open('runs/wo-gh-37/report.json'))['verdict'])" 2>/dev/null || echo "no-report")
          git commit -m "ANVIL execute run wo-gh-37 (issue 37): verdict ${VERDICT}" -m "Stations executed on the standing per-station wiring through the Cloudflare AI Gateway. Builder change and run evidence included; see runs/wo-gh-37/."
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; echo "Rebase onto the branch tip failed; pushing as is not attempted."; exit 1; }
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Comment the run report on issue 37
        if: always() && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path
          run_url = os.environ["RUN_URL"]
          branch = os.environ["BRANCH"]
          report_path = Path("runs/wo-gh-37/report.json")
          if not report_path.exists():
              lines = [
                  "## ANVIL execute run report",
                  "",
                  "The executed run did not produce a report.json, so there is no verdict to report. "
                  f"See the workflow run for the failure: {run_url}",
              ]
              Path("comment.md").write_text("\n".join(lines) + "\n")
              raise SystemExit(0)
          report = json.loads(report_path.read_text())
          decision = report.get("decision", {})
          lines = [
              "## ANVIL execute run report",
              "",
              f"Work order: {report['work_order_id']}",
              f"Pipeline: {report['pipeline']}",
              f"Approver verdict: {report['verdict']}",
              f"Human review required: {report['human_required']}",
              f"Deployment status: {report.get('deployment_status')}",
              "",
              "Decision record:",
              f"- Approver: {decision.get('approver', {}).get('rule', '')}",
              f"- Human gate: {decision.get('human_gate', {}).get('rule', '')}",
              "",
              "| Station | Status | Configured model | Executed model |",
              "|---|---|---|---|",
          ]
          for step in report.get("steps", []):
              lines.append(
                  f"| {step['station']} | {step['status']} | "
                  f"{step.get('configured_model')} | {step.get('executed_model')} |"
              )
          warnings = report.get("warnings") or []
          if warnings:
              lines += ["", "Warnings recorded by the run:"] + [f"- {w}" for w in warnings]
          diff_path = Path("run-diff.txt")
          if diff_path.exists() and diff_path.read_text().strip():
              lines += ["", "Files changed by the run (committed to "
                        f"`{branch}`):", "", "```", diff_path.read_text().strip(), "```"]
          lines += [
              "",
              "Honest note: this run EXECUTED its agent stations on the standing "
              "per-station wiring through the Cloudflare AI Gateway: the builder edited "
              "the working tree, the reviewers answered with review JSON "
              "that the approver aggregated for this run only.",
              f"Workflow run: {run_url}",
          ]
          Path("comment.md").write_text("\n".join(lines) + "\n")
          print(f"Verdict: {report['verdict']}")
          PYEOF
          gh issue comment 37 --body-file comment.md

      - name: Upload the run directory
        if: always() && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: anvil-execute-run-wo-gh-37
          path: runs/
          if-no-files-found: ignore
